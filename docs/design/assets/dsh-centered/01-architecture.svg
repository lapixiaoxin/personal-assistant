<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <title id="diagram-title">lumi 工程总图：以 DSH 为核心 Harness</title>
  <desc id="diagram-desc">Proposed v0.3，目标设计，非已上线能力。飞书、CLI、PWA 和语音经身份化输入进入单一权威 lumi Host。Host 持有确定性任务与动作账本、身份授权、上下文、持久触发、通知和核验。中央 DSH 基于 Cordis，是唯一 AgentLoop；lumi coordinator 在其中规划、调用模型、Skills、Tools、Subagents 和 MCP。DSH 通过 lumi Cordis 桥接调用 Host 端口，由 Host 分配允许的执行位置。记忆、目标和证据归 Host，DSH 只读取范围化视图。外部生产写入只能经过 Host Action Broker、Connector 或 Device Agent，再到云服务或设备；回执和观测证据回到 Host 独立核验。蓝色表示认知与上下文路径，青色表示 Host 与回执，琥珀色表示真实动作路径。不另建 Planner 或通用 plugin-host。边界为逻辑职责，不限定物理部署位置。</desc>

  <rect width="1440" height="1320" fill="#f7fafc"/>
