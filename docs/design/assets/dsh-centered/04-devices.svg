      <circle cx="90" cy="905" r="26" fill="#def2ef"/>
      <g fill="none" stroke="#167b76" stroke-width="2.3" stroke-linejoin="round">
        <path d="M72 912 V901 L78 898 L82 889 H98 L102 898 L108 901 V912 Z M78 898 H102"/>
        <circle cx="80" cy="913" r="3" fill="#def2ef"/>
        <circle cx="100" cy="913" r="3" fill="#def2ef"/>
      </g>
      <text x="130" y="901" font-size="22" font-weight="700" fill="#165d5c">机器人 / 车</text>
      <text x="130" y="932" font-size="18" fill="#3f6667">既有控制器接收高层目标</text>
      <path d="M76 958 H396" fill="none" stroke="#d6e8e3"/>
      <text x="78" y="983" font-size="17" fill="#896020">运动控制 / 安全闭环留在控制器</text>
      <text x="78" y="1010" font-size="17" fill="#896020">不交给 LLM 实时控制</text>
    </g>

    <g id="authoritative-host">
