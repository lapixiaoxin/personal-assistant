        <rect x="601" y="915" width="26" height="10" rx="2"/>
        <path d="M607 904 H611 M607 920 H611"/>
      </g>
      <text x="656" y="902" font-size="21" font-weight="700" fill="#245b9d">受控远端 DSH workers</text>
      <text x="656" y="931" font-size="17" fill="#52677d">可选 · 仅获任务子集与短期授权</text>
      <text x="594" y="971" font-size="18">主动 TLS 连接 Host；回传证据</text>
      <text x="594" y="1001" font-size="18" fill="#52677d">同一 taskId，无第二份权威账本</text>
      <text x="594" y="1031" font-size="18" fill="#52677d">不取得生产凭据，不成为备用主节点</text>
    </g>
    <g id="third-party-services">
      <path d="M1120 876 H1362 L1382 896 V1038 L1362 1058 H1120 L1100 1038 V896 Z" fill="#fff9ed" stroke="#c69b54" stroke-width="2" stroke-dasharray="6 5"/>
      <circle cx="1137" cy="914" r="24" fill="#fbe8bc"/>
      <g fill="none" stroke="#9b6b17" stroke-width="2">
        <circle cx="1137" cy="914" r="15"/>
        <ellipse cx="1137" cy="914" rx="7" ry="15"/>
        <path d="M1123 909 H1151 M1123 919 H1151"/>
      </g>
      <text x="1175" y="920" font-size="22" font-weight="700" fill="#805611">互联网第三方</text>
      <text x="1120" y="962" font-size="19">飞书 · 日历 · SaaS</text>
      <text x="1120" y="994" font-size="18" fill="#766b52">结果 / 业务回执回传</text>
      <text x="1120" y="1026" font-size="18" fill="#766b52">服务回包不等于目标达成</text>
    </g>

    <g id="connection-contract">
      <rect x="32" y="1090" width="1376" height="102" rx="18" fill="#e9f0fa" stroke="#c6d7ed" stroke-width="1.5"/>
      <path d="M72 1110 L93 1119 V1140 Q93 1158 72 1169 Q51 1158 51 1140 V1119 Z" fill="#2864ae"/>
      <path d="M62 1139 L70 1147 L83 1131" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112" y="1125" font-size="21" font-weight="700" fill="#245b9d">连接协议</text>
      <text x="224" y="1125" font-size="20">设备主动 TLS 出站 · 短期身份 · 能力声明（声明不等于授权）</text>
      <text x="112" y="1154" font-size="19" font-weight="700" fill="#805611">命令 ID + TTL + 回执；ack ≠ 动作完成，必须返回实际结果与可核验证据。</text>
      <text x="112" y="1180" font-size="17" fill="#52677d">命令与结果沿已建立连接往返；设备不开放公网入站。结果未知先对账，不能盲目重试。</text>
    </g>

    <g id="offline-reconnect-migration">
      <path d="M32 1212 H472 M496 1212 H936 M960 1212 H1408" fill="none" stroke="#cbd9e5" stroke-width="2"/>
      <circle cx="55" cy="1238" r="15" fill="#fbe8bc"/>
      <path d="M48 1231 L62 1245 M62 1231 L48 1245" fill="none" stroke="#9b6b17" stroke-width="2.2" stroke-linecap="round"/>
      <text x="82" y="1244" font-size="19" font-weight="700" fill="#805611">离线：仅已允许的采集 / 草稿</text>
      <text x="82" y="1275" font-size="17" fill="#52677d">不新增高风险授权，不擅自执行写动作</text>
      <circle cx="519" cy="1238" r="15" fill="#def2ef"/>
      <path d="M511 1237 A8 8 0 0 1 525 1232 M525 1227 V1233 H519 M527 1240 A8 8 0 0 1 513 1245" fill="none" stroke="#167b76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="546" y="1244" font-size="19" font-weight="700" fill="#136b69">重连：去重 / 续传</text>
      <text x="546" y="1275" font-size="17" fill="#52677d">按稳定命令 ID 对账，再决定是否续执行</text>
      <circle cx="983" cy="1238" r="15" fill="#dce8f9"/>
      <text x="983" y="1245" text-anchor="middle" font-size="20" font-weight="700" fill="#245b9d">1</text>
      <text x="1010" y="1244" font-size="19" font-weight="700" fill="#245b9d">迁移：单权威，不双主</text>
      <text x="1010" y="1275" font-size="17" fill="#52677d">先停旧 Host 写权，再启新 Host</text>
    </g>
    <text x="40" y="1325" font-size="15" fill="#64798e">目标设计，非已启用能力；24h 可用性与设备权限须分别验证。</text>
    <text x="1400" y="1325" font-size="15" text-anchor="end" fill="#64798e">lumi · 2026-09-25</text>
  </g>
</svg>
