    <polygon points="1236,864 1242,876 1248,864" fill="#b48129"/>
    <text x="1256" y="824" font-size="16" fill="#93661f">TLS / 受控出口</text>

    <g id="optional-remote-workers">
      <rect x="570" y="867" width="468" height="196" rx="22" fill="#f0f5fc" stroke="#7f9fc6" stroke-width="2" stroke-dasharray="7 6"/>
      <polygon points="614,883 640,898 640,928 614,943 588,928 588,898" fill="#dfeafa" stroke="#5381b9" stroke-width="1.5"/>
