      <text x="626" y="387" font-size="19">身份 / 设备注册</text>
      <text x="626" y="421" font-size="19">任务 / 动作授权</text>
      <text x="842" y="387" font-size="19">持久调度</text>
      <text x="842" y="421" font-size="19">通知 / 结果核验</text>

      <g id="authoritative-storage">
