        <path d="M829 470 H881 L897 486 H991 V578 H829 Z" fill="#e3f3f0" stroke="#3e9992" stroke-width="2" stroke-linejoin="round"/>
        <path d="M830 499 H990" fill="none" stroke="#8fc2bc" stroke-width="1.5"/>
        <text x="910" y="536" text-anchor="middle" font-size="22" font-weight="700" fill="#176c67">文件证据</text>
        <text x="910" y="561" text-anchor="middle" font-size="17" fill="#4b7373">产物 · 回执</text>
      </g>
      <text x="806" y="623" text-anchor="middle" font-size="20" font-weight="700" fill="#245b9d">共享同一权威任务 / taskId</text>
