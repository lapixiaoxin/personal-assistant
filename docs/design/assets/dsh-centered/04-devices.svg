      <text x="1182" y="340" font-size="17" fill="#896020">本机为主 · 受限域</text>
      <text x="1120" y="381" font-size="19">唯一认知 / 执行循环</text>
      <text x="1120" y="411" font-size="18" fill="#52677d">按 Host 授权执行与回传</text>
      <text x="1120" y="441" font-size="18" fill="#52677d">不持有独立任务权威</text>
    </g>

    <g id="authorized-egress">
