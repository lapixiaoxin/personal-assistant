      <rect x="844" y="274" width="170" height="31" rx="15.5" fill="#e6effc"/>
      <text x="929" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#245b9d">唯一权威 / 信任域</text>
      <path d="M616 279 L639 288 V310 Q639 329 616 339 Q593 329 593 310 V288 Z" fill="#2864ae"/>
      <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
