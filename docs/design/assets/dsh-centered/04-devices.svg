      <polygon points="1050,651 1038,657 1050,663" fill="#188a85"/>
      <text x="1069" y="581" text-anchor="middle" font-size="15" fill="#896020">授权</text>
      <text x="1069" y="683" text-anchor="middle" font-size="15" fill="#136b69">回执</text>
      <path d="M1120 518 H1362 L1382 538 V686 L1362 706 H1120 L1100 686 V538 Z" fill="#fff9ed" stroke="#bb8b36" stroke-width="2"/>
      <circle cx="1140" cy="558" r="25" fill="#fbe8bc"/>
      <g fill="none" stroke="#9b6b17" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
