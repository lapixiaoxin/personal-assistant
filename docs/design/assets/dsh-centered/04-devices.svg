      <polygon points="1088,367 1100,373 1088,379" fill="#2864ae"/>
      <polyline points="1100,414 1038,414" fill="none" stroke="#188a85" stroke-width="2.5"/>
      <polygon points="1050,408 1038,414 1050,420" fill="#188a85"/>
      <text x="1069" y="355" text-anchor="middle" font-size="15" fill="#245b9d">派发</text>
      <text x="1069" y="440" text-anchor="middle" font-size="15" fill="#136b69">证据</text>
    </g>
    <g id="local-dsh-workers">
      <rect x="1100" y="276" width="282" height="188" rx="20" fill="#ffffff" stroke="#be974f" stroke-width="2" stroke-dasharray="5 4"/>
      <polygon points="1140,287 1165,301 1165,329 1140,343 1115,329 1115,301" fill="#e5eefc" stroke="#5381b9" stroke-width="1.5"/>
      <g fill="none" stroke="#2864ae" stroke-width="2.2" stroke-linejoin="round">
