<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1340" viewBox="0 0 1440 1340" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">多设备部署 · Proposed v0.3</title>
  <desc id="diagram-description">一个常驻 lumi Host 是身份、任务、动作授权、调度、通知与结果核验的唯一权威，持有 SQLite 和文件证据。初期部署在当前 Mac，需要 24h 值守时迁至 Mac mini 或服务器，迁移不双主。本机 DSH workers 为主，受控远端可选，均共享 Host 的同一权威任务。桌面 Device Agent、手机和家庭网关主动通过 TLS 出站连接 Host；可穿戴仅经手机伴侣接入，机器人和车只接收交给既有控制器的高层目标。第三方 Connector 也经过 Host 授权出口。连接使用短期身份与能力声明，命令携带 ID、TTL 和回执；ack 不等于动作完成。离线只允许已获许可的采集与草稿，重连去重、续传并先对账，不新增高风险授权。</desc>
  <rect width="1440" height="1340" fill="#f7fafc"/>

  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#18324f">
    <text x="40" y="38" font-size="13" font-weight="700" letter-spacing="2" fill="#52718b">LUMI / DEPLOYMENT</text>
    <text x="40" y="86" font-size="36" font-weight="700">多设备部署</text>
    <text x="40" y="122" font-size="19" fill="#52677d">一个常驻 Host，多个受控执行端；设备和会话都不拥有第二份权威。</text>
    <rect x="1176" y="34" width="224" height="40" rx="20" fill="#fff2d9" stroke="#d49a31"/>
    <text x="1288" y="61" font-size="19" font-weight="700" text-anchor="middle" fill="#895511">Proposed v0.3</text>
    <circle cx="1082" cy="108" r="6" fill="#2864ae"/>
    <text x="1096" y="114" font-size="16" fill="#52677d">权威</text>
    <circle cx="1186" cy="108" r="6" fill="#128681"/>
    <text x="1200" y="114" font-size="16" fill="#52677d">设备</text>
    <circle cx="1290" cy="108" r="6" fill="#be8120"/>
    <text x="1304" y="114" font-size="16" fill="#52677d">信任边界</text>

    <!-- Deployment boundaries are separate from the Host's authority boundary. -->
    <rect x="32" y="158" width="408" height="905" rx="24" fill="#edf8f6" stroke="#7cbbb6" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="58" y="196" font-size="21" font-weight="700" fill="#136b69">边缘设备 / 各自 OS 权限域</text>
    <text x="58" y="225" font-size="18" fill="#4b7373">能力可分布，授权不分散</text>

    <rect x="548" y="158" width="860" height="606" rx="24" fill="#edf3fc" stroke="#86a8d0" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="576" y="196" font-size="22" font-weight="700" fill="#245b9d">常驻部署节点 / 本机边界</text>
    <text x="576" y="228" font-size="18" fill="#52677d">初期：当前 Mac（休眠即离线）</text>
    <text x="998" y="228" font-size="17" fill="#52677d">需要 24h 值守：迁 Mac mini / 服务器</text>

    <!-- Shared visual trunk: each endpoint establishes its own outbound TLS link. -->
    <g fill="none" stroke="#188a85" stroke-width="3" stroke-linejoin="round">
      <polyline points="418,315 483,315 483,933"/>
      <polyline points="418,472 483,472"/>
      <polyline points="418,738 483,738"/>
      <polyline points="418,933 483,933"/>
      <polyline points="483,373 574,373"/>
    </g>
    <g fill="#188a85">
      <polygon points="460,309 472,315 460,321"/>
      <polygon points="460,466 472,472 460,478"/>
      <polygon points="460,732 472,738 460,744"/>
      <polygon points="460,927 472,933 460,939"/>
      <polygon points="562,366 574,373 562,380"/>
      <circle cx="483" cy="315" r="4"/>
      <circle cx="483" cy="373" r="5"/>
      <circle cx="483" cy="472" r="4"/>
      <circle cx="483" cy="738" r="4"/>
      <circle cx="483" cy="933" r="4"/>
    </g>
    <text x="529" y="352" font-size="17" text-anchor="middle" font-weight="700" fill="#136b69">TLS</text>
    <text x="514" y="638" transform="rotate(-90 514 638)" text-anchor="middle" font-size="18" fill="#136b69">各设备独立发起出站连接</text>

