      <text x="1120" y="677" font-size="18" fill="#766b52">DSH / 设备不可旁路</text>
    </g>

    <!-- Only controlled links cross into remote execution and third-party domains. -->
    <path d="M548 795 H1408" fill="none" stroke="#c28f3d" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="558" y="787" font-size="16" fill="#93661f">跨网络与信任边界</text>
