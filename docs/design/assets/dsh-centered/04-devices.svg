      <text x="658" y="309" font-size="29" font-weight="700" fill="#214f89">lumi Host</text>
      <text x="658" y="337" font-size="16" fill="#52677d">确定性控制，非第二套 Agent Loop</text>
      <path d="M598 353 H1014" fill="none" stroke="#d9e4f2" stroke-width="1.5"/>

