<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="title description">
  <title id="title">个人资产与上下文 | Proposed v0.3</title>
  <desc id="description">设计目标，尚未启用。用户明确偏好、目标和纠正，任务证据与反馈，以及不可信外部材料先进入候选记忆，记录来源、置信度、适用范围和有效期。候选按规则确认或经冲突复核后，由 lumi Host 持有版本化身份与偏好、目标承诺、决策记忆、产物证据，使用 SQLite 与文件保存，支持导出和撤回。Context Builder 按 Task、权限、相关性、token 预算与时效构建上下文，交给 DSH 主 agent，子 agent 只获子任务所需子集。结果与反馈重新进入候选。DSH transcript 与 compaction 仅是执行材料；检索和向量索引是可重建投影，均不是唯一事实源。撤回与纠正更新 Host 版本和撤回标记，使索引与缓存失效，并在后续上下文中排除旧版本。记忆和置信度不能充当权限凭证。</desc>

