    <path d="M52 1152 H1348" fill="none" stroke="#d9e4ec" stroke-width="1.5"/>
    <path d="M68 1170 L83 1176 V1188 Q83 1198 68 1203 Q53 1198 53 1188 V1176 Z" fill="#fff0cc" stroke="#b8801b" stroke-width="1.7" stroke-linejoin="round"/>
