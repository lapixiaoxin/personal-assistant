    <text x="52" y="91" font-size="34" font-weight="700">个人资产与上下文</text>
    <text x="52" y="124" font-size="18" fill="#526b7f">资产归用户与 Host；上下文按需构建；执行反馈回到候选，而非直接成为记忆。</text>
    <rect x="1158" y="39" width="190" height="38" rx="19" fill="#e8eef5" stroke="#cbd7e3"/>
    <text x="1253" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#415770">Proposed v0.3</text>
    <text x="1348" y="104" text-anchor="end" font-size="14" fill="#62788d">目标设计，非已启用能力</text>
    <circle cx="965" cy="135" r="5" fill="#2563eb"/>
