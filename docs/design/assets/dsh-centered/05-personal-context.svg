    <circle cx="1097" cy="135" r="5" fill="#0f8b8d"/>
    <text x="1110" y="140" font-size="14" fill="#415770">Host 资产</text>
    <circle cx="1234" cy="135" r="5" fill="#c48817"/>
    <text x="1247" y="140" font-size="14" fill="#415770">候选 / 审批</text>

