    <text x="100" y="1190" font-size="22" font-weight="700" fill="#855b13">记忆不能充当权限凭证</text>
    <text x="433" y="1188" font-size="17" fill="#526b7f">置信度不授予权限；动作仍须核验当前有效授权。</text>
    <text x="52" y="1225" font-size="13" fill="#73889b">纠正与撤回同时使旧索引、检索缓存失效；后续 Context 必须使用有效版本。</text>
