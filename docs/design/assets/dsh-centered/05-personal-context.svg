    <text x="604" y="1105" font-size="17" fill="#526b7f">会话与压缩摘要仅是执行材料，不是权威个人记忆。</text>
    <text x="56" y="1068" font-size="17" font-weight="700" fill="#526b7f">实线：数据流与结果回流</text>
    <path d="M57 1092 H99" fill="none" stroke="#7a91a5" stroke-width="2" stroke-dasharray="6 5"/>
