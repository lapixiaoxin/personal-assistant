<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#172B4D">
  <title id="diagram-title">DIY与持续进化 · Proposed v0.3</title>
  <desc id="diagram-desc">用于“DIY与持续进化”章节的设计图，非已启用能力声明。上部：Skill（知识）、Cordis Plugin（运行时服务）、MCP（工具资源）、外部 Agent（专家）、Device Adapter（设备），经过描述契约与版本注册、schema、权限、副作用及健康声明，独立测试和动作出口验证后，以 disabled 状态安装；授权启用 profile 后，DSH 才可发现调用，写入仍经过 Host Broker。复用 DSH Cordis，不另造通用 plugin-host。下部：真实任务结果与用户反馈，形成可量化失败和候选 SOP，进入 SDD spec 及验收、隔离 DSH Code Agent 实现、独立验证、受权发布门禁、观察与回滚；升级版本回到上部重新准入，观察结果继续积累为证据。独立验证不接受执行者自己宣布通过。日常开发现在可由 Agent 托管，自动发布是后续 M5。安装不等于启用，不等于授权。宪章、授权根、受保护验收不由普通开发 Agent 更改。一次成功的 SOP 仅标 verified_once。</desc>

